name: Build NCCIA Android Mobile App (APK)

on:
  push:
    branches: [ main ]
    paths:
      - 'mobile-app/**'
      - 'react-app/**'
      - '.github/workflows/build-android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Compile Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Java JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.22.0'

      - name: Build Web & Mobile Applications
        working-directory: react-app
        run: |
          npm ci --ignore-scripts
          npm run build
          npm run build:mobile

      - name: Setup Mobile App & Sync Capacitor
        working-directory: mobile-app
        run: |
          npm ci --ignore-scripts
          npx --no-install cap sync android

      - name: Grant Execute Permission for Gradle
        working-directory: mobile-app/android
        run: chmod +x gradlew

      - name: Build Android Debug APK
        working-directory: mobile-app/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Prepare APK for Release Artifact
        run: |
          mkdir -p release-apk
          cp mobile-app/android/app/build/outputs/apk/debug/app-debug.apk release-apk/NCCIA-CMS-v2.4.1.apk
          echo "APK build complete: release-apk/NCCIA-CMS-v2.4.1.apk"

      - name: Upload Downloadable APK Artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: NCCIA-CMS-Mobile-App-v2.4.1
          path: release-apk/NCCIA-CMS-v2.4.1.apk
          retention-days: 30
