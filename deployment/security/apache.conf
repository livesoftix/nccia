[realerp@decloud ~]$# Apache 2.4 dedicated-host template: enable ssl, headers, rewrite, proxy, proxy_fcgi.
# Replace hostname/paths; validate with apachectl configtest before activation.
# Reference: https://httpd.apache.org/docs/2.4/mod/mod_ssl.html
ServerTokens Prod
ServerSignature Off
TraceEnable Off

<VirtualHost *:80>
    ServerName nccia.example.invalid
    Redirect permanent / https://nccia.example.invalid/
</VirtualHost>

<VirtualHost *:443>
    ServerName nccia.example.invalid
    DocumentRoot /srv/nccia/current/public
    SSLEngine on
    SSLCertificateFile /etc/nccia/tls/fullchain.pem
    SSLCertificateKeyFile /etc/nccia/tls/private.key
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLSessionTickets off
    LimitRequestBody 209715200
    ProxyTimeout 120
    # %U omits query strings; do not log Authorization, cookies, bodies or referrers.
    LogFormat "%a %t \"%m %U %H\" %>s %B" nccia_safe
    CustomLog /var/log/apache2/nccia-access.log nccia_safe
    ErrorLog /var/log/apache2/nccia-error.log
    Header always unset X-Powered-By
    Header always set Strict-Transport-Security "max-age=63072000; includeSubDomains"
    Header always set X-Frame-Options "DENY"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "same-origin"
    Header always set Permissions-Policy "camera=(self), microphone=(self), geolocation=(), payment=(), usb=()"

    <Directory /srv/nccia/current/public>
        Options -Indexes -Includes -ExecCGI -MultiViews
        AllowOverride None
        Require all granted
        RewriteEngine On
        RewriteRule ^(?:storage|uploads)(?:/|$) - [F,END,NC]
        RewriteRule (^|/)\. - [F,END]
        RewriteRule \.(?:sql|sqlite3?|db|bak|log|ini|conf|ncbk|zip|tar|7z)(?:$|/) - [F,END,NC]
        RewriteRule ^(?:artisan|composer\.(?:json|lock)|package(?:-lock)?\.json|phpunit\.xml)(?:$|/) - [F,END,NC]
        RewriteRule ^(?!index\.php$).*\.php(?:/|$) - [F,END,NC]
        RewriteRule .* - [E=HTTP_AUTHORIZATION:%{HTTP:Authorization},E=HTTP_X_XSRF_TOKEN:%{HTTP:X-XSRF-Token}]
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ index.php [END]
        <Files "index.php">
            SetHandler "proxy:unix:/run/php/nccia-fpm.sock|fcgi://localhost/"
        </Files>
    </Directory>
    <Directory /srv/nccia/shared>
        Require all denied
    </Directory>
</VirtualHost>
