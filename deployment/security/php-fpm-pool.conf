; Dedicated PHP-FPM pool: install code read-only; only storage/cache are writable.
[nccia]
user = nccia
group = nccia
listen = /run/php/nccia-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660
pm = dynamic
pm.max_children = 12
pm.start_servers = 2
pm.min_spare_servers = 2
pm.max_spare_servers = 4
pm.max_requests = 500
request_terminate_timeout = 125s
catch_workers_output = yes
clear_env = yes
security.limit_extensions = .php
chdir = /srv/nccia/current
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /srv/nccia/shared/storage/logs/php-error.log
; Use a protected .env (0400 nccia) or explicitly allowlisted secret-manager env entries.
