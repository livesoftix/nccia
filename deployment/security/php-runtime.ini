; Apply to production FPM/worker PHP, then inspect effective configuration.
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL
allow_url_include = Off
cgi.fix_pathinfo = 0
session.use_strict_mode = 1
session.use_only_cookies = 1
session.cookie_secure = 1
session.cookie_httponly = 1
session.cookie_samesite = Strict
upload_max_filesize = 50M
post_max_size = 200M
max_file_uploads = 100
max_input_time = 60
max_execution_time = 120
memory_limit = 512M
zend.exception_ignore_args = On
opcache.enable = 1
opcache.validate_timestamps = 0
; Reload/restart FPM on release so the OPcache switches to the new immutable code.
; Required extensions: curl, mbstring, dom/xml, fileinfo, gd, zip, pdo_mysql, sodium.
; ClamAV and PDF/OCR invoke bounded processes: do not disable process functions blindly.
