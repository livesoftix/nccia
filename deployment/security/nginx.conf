# Template for a dedicated Linux host; replace hostname, certificate paths and socket.
# Validate with nginx -t before activation. TLS termination at a proxy needs separate review.
# Reference: https://nginx.org/en/docs/http/ngx_http_core_module.html
log_format combined_safe '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';
server {
    listen 80;
    server_name nccia.example.invalid;
    return 308 https://nccia.example.invalid$request_uri;
}

server {
    listen 443 ssl;
    server_name nccia.example.invalid;
    root /srv/nccia/current/public;
    index index.php;
    ssl_certificate /etc/nccia/tls/fullchain.pem;
    ssl_certificate_key /etc/nccia/tls/private.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    server_tokens off;
    autoindex off;
    client_max_body_size 200m;
    client_body_timeout 30s;
    send_timeout 30s;

    # Omit query strings and referrers, which can include private identifiers or signed URLs.
    access_log /var/log/nginx/nccia-access.log combined_safe;
    error_log /var/log/nginx/nccia-error.log warn;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(), payment=(), usb=()" always;

    # Evidence is served through authenticated controllers, never public storage links.
    location ~* ^/(?:storage|uploads)(?:/|$) { return 404; }
    location ~ /\. { return 404; }
    location ~* (?:^|/)(?:artisan|composer\.(?:json|lock)|package(?:-lock)?\.json|phpunit\.xml)(?:$|/) { return 404; }
    location ~* \.(?:sql|sqlite|sqlite3|db|bak|log|ini|conf|ncbk|zip|tar|7z)(?:$|/) { return 404; }

    location = /index.php {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/nccia-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTP_PROXY "";
        fastcgi_param HTTPS on;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 120s;
    }
    location ~* \.php(?:/|$) { return 404; }
    location / { try_files $uri $uri/ /index.php?$query_string; }
}

# Include this entire file at nginx's http {} level.
